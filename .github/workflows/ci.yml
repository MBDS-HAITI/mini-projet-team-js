name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Backend CI
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./school-backend
    
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: school-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint --if-present
        continue-on-error: true

      - name: Run tests
        run: npm test --if-present
        env:
          MONGODB_URI: mongodb://localhost:27017/school-test
          JWT_SECRET: test-secret-key-for-ci-pipeline
          NODE_ENV: test
          PORT: 5000

      - name: Check server startup
        run: |
          echo "Checking if server can start..."
          timeout 10s node src/server.js || echo "Server check completed"
        env:
          MONGODB_URI: mongodb://localhost:27017/school-test
          JWT_SECRET: test-secret-key
          NODE_ENV: test
          PORT: 5000

  # Frontend CI
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./school-front

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: school-front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test --if-present
        env:
          VITE_API_URL: http://localhost:5000

      - name: Build application
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5000
          VITE_GOOGLE_CLIENT_ID: test-client-id

      - name: Check build output
        run: |
          echo "Checking build artifacts..."
          ls -la dist/
          du -sh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: school-front/dist
          retention-days: 7

  # Summary Job
  ci-summary:
    name: CI Summary
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Check CI Status
        run: |
          echo "CI Results:"
          echo "Backend: ${{ needs.backend-ci.result }}"
          echo "Frontend: ${{ needs.frontend-ci.result }}"
          
          if [ "${{ needs.backend-ci.result }}" == "success" ] && [ "${{ needs.frontend-ci.result }}" == "success" ]; then
            echo "✅ All CI checks passed!"
            exit 0
          else
            echo "❌ Some CI checks failed"
            exit 1
          fi
